name: Deploy Connect Cloud demos

on:
  # Demos publish when a release is published, or by hand. Merges to main
  # do not deploy, which keeps Connect Cloud usage credits for releases.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      apps:
        description: Demo selection (core5 is demo, dashboard, inputs, olympics, chat)
        type: choice
        default: core5
        options: [all, core5, demo, dashboard, intensity, inputs, olympics, plotly_gt, chat]
      dry_run:
        description: Stage and validate only; do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: connect-cloud-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'ericrayanderson/shinyglass' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: connect-cloud-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache: false
          extra-packages: |
            any::rsconnect
            any::remotes
            any::shinyWidgets
            any::ggthemes
            any::dplyr
            any::data.table
            any::reactable
            any::tidyr
            any::plotly
            any::gt
            any::waiter
            any::cpp11
            any::ggtext
            any::shinychat
            any::ellmer
            local::.
      - name: Reinstall repository packages with portable metadata
        shell: Rscript {0}
        run: |
          # pak records CRAN installs as RemoteType=standard and extra-packages
          # as RemoteType=any, both with Repository: RSPM (a name, not a URL).
          # renv snapshots that name, and the host then tries
          # RSPM/src/contrib/... which is not a valid URL.
          # extra-packages can also carry PPM-only versions (data.table 1.18.6.1).
          installed <- installed.packages(fields = c("RemoteType", "Repository"))
          remote <- installed[, "RemoteType"]
          repository <- installed[, "Repository"]
          priority <- installed[, "Priority"]
          skip <- rownames(installed) %in% c("shinyglass", "rsconnect", "remotes") |
            (!is.na(priority) & priority %in% c("base", "recommended"))
          needs <- !skip & (
            (!is.na(remote) & remote %in% c("standard", "any")) |
            (!is.na(repository) & nzchar(repository) & !grepl("^https?://", repository))
          )
          rewrite <- unique(rownames(installed)[needs])
          any_pkgs <- intersect(
            rewrite,
            rownames(installed)[!is.na(remote) & remote == "any"]
          )
          standard_pkgs <- setdiff(rewrite, any_pkgs)
          if (length(standard_pkgs)) {
            message("Reinstalling from RSPM: ", paste(standard_pkgs, collapse = ", "))
            install.packages(standard_pkgs, repos = c(CRAN = Sys.getenv("RSPM")))
          }
          if (length(any_pkgs)) {
            message("Reinstalling from CRAN: ", paste(any_pkgs, collapse = ", "))
            ncpus <- max(1L, parallel::detectCores() - 1L)
            Sys.unsetenv(c("RSPM", "RENV_CONFIG_REPOS_OVERRIDE"))
            install.packages(
              any_pkgs,
              repos = c(CRAN = "https://cloud.r-project.org"),
              Ncpus = ncpus
            )
            installed2 <- installed.packages(fields = "RemoteType")
            present <- any_pkgs[any_pkgs %in% rownames(installed2)]
            remote2 <- installed2[present, "RemoteType"]
            still_any <- present[!is.na(remote2) & remote2 == "any"]
            if (length(still_any)) {
              stop("Failed to replace pak metadata for: ",
                   paste(still_any, collapse = ", "))
            }
          }
      - name: Install the exact release or main commit with GitHub provenance
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remotes::install_github(
            paste0("ericrayanderson/shinyglass@", Sys.getenv("GITHUB_SHA")),
            dependencies = FALSE, upgrade = "never", force = TRUE
          )
          stopifnot(identical(
            utils::packageDescription("shinyglass")$RemoteSha,
            Sys.getenv("GITHUB_SHA")
          ))
      - name: Authenticate and deploy (or stage a dry run)
        shell: Rscript {0}
        env:
          R_USER_CONFIG_DIR: ${{ runner.temp }}/connect-cloud-config
          CONNECT_CLOUD_CLIENT_ID: ${{ secrets.CONNECT_CLOUD_CLIENT_ID }}
          CONNECT_CLOUD_CLIENT_SECRET: ${{ secrets.CONNECT_CLOUD_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # A release publishes core5 for real. workflow_dispatch keeps its inputs,
          # including dry_run and the single-app choices.
          DEPLOY_APPS: ${{ github.event_name == 'release' && 'core5' || inputs.apps }}
          DEPLOY_DRY_RUN: ${{ github.event_name == 'release' && 'false' || inputs.dry_run }}
        run: |
          # A release always publishes the five hosted apps. intensity and
          # plotly_gt have no content item, so only a dry run accepts them.
          if (identical(Sys.getenv("GITHUB_EVENT_NAME"), "release")) {
            Sys.setenv(DEPLOY_APPS = "core5", DEPLOY_DRY_RUN = "false")
          }
          dry_run <- identical(Sys.getenv("DEPLOY_DRY_RUN"), "true")
          if (!dry_run) {
            if (!nzchar(Sys.getenv("CONNECT_CLOUD_CLIENT_ID")) ||
                !nzchar(Sys.getenv("CONNECT_CLOUD_CLIENT_SECRET"))) {
              stop("Add CONNECT_CLOUD_CLIENT_ID and CONNECT_CLOUD_CLIENT_SECRET to the connect-cloud-production environment.")
            }
            rsconnect::connectCloudClientCredentials(
              clientId = Sys.getenv("CONNECT_CLOUD_CLIENT_ID"),
              clientSecret = Sys.getenv("CONNECT_CLOUD_CLIENT_SECRET"),
              accountName = "ericrayanderson"
            )
          }
          Sys.unsetenv(c("CONNECT_CLOUD_CLIENT_ID", "CONNECT_CLOUD_CLIENT_SECRET"))
          # GEMINI_API_KEY stays in the environment for the chat staging
          # step. The deploy script reads the name and does not print it.
          apps <- Sys.getenv("DEPLOY_APPS")
          allowed <- c("demo", "dashboard", "intensity", "inputs", "olympics", "plotly_gt", "chat")
          if (identical(apps, "all")) apps <- paste(allowed, collapse = ",")
          if (identical(apps, "core5")) apps <- "demo,dashboard,inputs,olympics,chat"
          stopifnot(all(strsplit(apps, ",", fixed = TRUE)[[1]] %in% allowed))
          args <- c("inst/scripts/deploy-connect-cloud-demos.R",
                    "--account=ericrayanderson", paste0("--apps=", apps))
          if (dry_run) args <- c(args, "--dry-run")
          status <- system2(file.path(R.home("bin"), "Rscript"), args)
          if (status != 0L) stop("Deployment script failed; inspect the preceding app logs.")
      - name: Remove temporary account configuration
        if: always()
        shell: Rscript {0}
        env:
          R_USER_CONFIG_DIR: ${{ runner.temp }}/connect-cloud-config
        run: |
          config <- Sys.getenv("R_USER_CONFIG_DIR")
          expected <- file.path(Sys.getenv("RUNNER_TEMP"), "connect-cloud-config")
          stopifnot(nzchar(Sys.getenv("RUNNER_TEMP")), identical(config, expected))
          unlink(config, recursive = TRUE)
