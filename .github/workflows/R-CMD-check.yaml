on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # Ubuntu covers release, devel, and oldrel. The release cell
          # builds the PDF manual. Windows and macOS stay on R 4.5: pak
          # cannot install R 4.6 dependencies there (zstd macOS binaries
          # for knitr/xfun, and no Windows pak binary index for 4.6).
          - {os: ubuntu-latest,  r: 'devel',    manual: false}
          - {os: ubuntu-latest,  r: 'release',  manual: true}
          - {os: ubuntu-latest,  r: 'oldrel-1', manual: false}
          - {os: macos-latest,   r: '4.5',      manual: false}
          - {os: windows-latest, r: '4.5',      manual: false}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::urlchecker, any::spelling, commonmark, xml2
          needs: check

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual

      - name: Install inconsolata
        if: matrix.config.manual
        run: tlmgr install inconsolata

      # Once a version is on CRAN, main carries that same version until the
      # next bump, and the remote incoming check then fails on "Insufficient
      # package version". Skip only the remote part in that case; URLs are
      # still checked by urlchecker below.
      - name: Skip remote incoming check when this version is already on CRAN
        shell: Rscript {0}
        run: |
          v <- read.dcf("DESCRIPTION", fields = c("Package", "Version"))
          db <- tryCatch(
            available.packages(repos = "https://cloud.r-project.org"),
            error = function(e) NULL
          )
          on_cran <- !is.null(db) && v[1, "Package"] %in% rownames(db) &&
            package_version(db[v[1, "Package"], "Version"]) >= package_version(v[1, "Version"])
          if (on_cran) {
            message("Version ", v[1, "Version"], " is already on CRAN; skipping remote incoming checks.")
            cat("_R_CHECK_CRAN_INCOMING_REMOTE_=false\n", file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          }

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.manual && 'c("--as-cran")' || 'c("--as-cran", "--no-manual")' }}
          build_args: ${{ matrix.config.manual && 'c("--compact-vignettes=gs+qpdf")' || 'c("--no-manual", "--compact-vignettes=gs+qpdf")' }}

      - name: Check URLs + Spelling
        if: matrix.config.r == 'release' && matrix.config.os == 'ubuntu-latest'
        run: |
          Rscript -e '
            last <- NULL
            for (i in 1:4) {
              last <- tryCatch(urlchecker::url_check(), error = function(e) e)
              if (!inherits(last, "error")) break
              message("url_check attempt ", i, " failed: ", conditionMessage(last))
              Sys.sleep(12 * i)
            }
            if (inherits(last, "error")) stop(last)
          '
          Rscript -e 'sp <- spelling::spell_check_package(); print(sp); if (nrow(sp)) stop(nrow(sp), " spelling issue(s)", call. = FALSE)'