on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # macOS runners sometimes fail here with pak "Cannot extract … unknown
      # archive type" on a binary tarball (seen on main for knitr). Retry once
      # rather than failing the matrix cell on that flake.
      - uses: r-lib/actions/setup-r-dependencies@v2
        id: install-deps
        continue-on-error: true
        with:
          extra-packages: any::rcmdcheck, any::urlchecker, any::spelling, commonmark, xml2
          needs: check

      - name: Retry R package install
        if: steps.install-deps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::urlchecker, any::spelling, commonmark, xml2
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--no-manual")'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

      - name: Check URLs + Spelling
        if: matrix.config.r == 'release' && matrix.config.os == 'ubuntu-latest'
        run: |
          Rscript -e '
            last <- NULL
            for (i in 1:4) {
              last <- tryCatch(urlchecker::url_check(), error = function(e) e)
              if (!inherits(last, "error")) break
              message("url_check attempt ", i, " failed: ", conditionMessage(last))
              Sys.sleep(12 * i)
            }
            if (inherits(last, "error")) stop(last)
          '
          Rscript -e "spelling::spell_check_package()"