name: Python

on:
  push:
    branches: [main, master]
    paths:
      - "python/**"
      - "inst/scss/**"
      - "inst/js/**"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "python/**"
      - "inst/scss/**"
      - "inst/js/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  test-editable:
    name: editable + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (editable, with theme/dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,theme]"

      - name: Vendor static assets from monorepo
        run: python scripts/vendor_assets.py
        env:
          SHINYGLASS_PKG_ROOT: ${{ github.workspace }}

      - name: Pytest
        run: pytest -q

  wheel-isolated:
    name: wheel in clean dir (no monorepo inst/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel from monorepo
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          pip install "libsass>=0.22" "shiny>=1.0" "htmltools>=0.5"
          python scripts/vendor_assets.py
          python -m build --wheel --outdir dist
        env:
          SHINYGLASS_PKG_ROOT: ${{ github.workspace }}

      - name: Install wheel in clean venv without monorepo
        working-directory: python
        run: |
          set -euo pipefail
          python -m venv /tmp/sg-venv
          /tmp/sg-venv/bin/pip install --upgrade pip
          # cwd is python/ (working-directory above)
          /tmp/sg-venv/bin/pip install dist/*.whl pytest
          # Isolate tests away from monorepo inst/
          rm -rf /tmp/sg-clean
          mkdir -p /tmp/sg-clean
          cp -r tests /tmp/sg-clean/tests
          cd /tmp/sg-clean
          /tmp/sg-venv/bin/python - <<'PY'
          import os
          os.environ.pop("SHINYGLASS_PKG_ROOT", None)
          os.chdir("/tmp/sg-clean")
          from shinyglass._assets import asset_source, has_vendored_static, package_root
          from shinyglass import glass_theme
          assert has_vendored_static(), "wheel must ship static/"
          assert package_root() is None, f"expected no monorepo, got {package_root()}"
          assert asset_source() == "vendored"
          css = glass_theme().to_css()
          assert "bslib-sidebar-layout" in css
          deps = glass_theme()._html_dependencies()
          assert any(d.name == "shinyglass" for d in deps)
          print("isolated wheel OK", len(css), "css bytes")
          PY
          /tmp/sg-venv/bin/pytest -q tests
