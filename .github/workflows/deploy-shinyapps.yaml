name: Deploy shinyapps.io demos

on:
  workflow_dispatch:
    inputs:
      apps:
        description: Demo selection (core5 fits the five-app plan)
        type: choice
        default: core5
        options: [all, core5, demo, dashboard, intensity, inputs, olympics, plotly_gt]
      dry_run:
        description: Stage and validate only; do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: shinyapps-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ericrayanderson/shinyglass' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: shinyapps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache: false
          extra-packages: |
            any::rsconnect
            any::remotes
            any::shinyWidgets
            any::ggthemes
            any::dplyr
            any::data.table
            any::reactable
            any::tidyr
            any::plotly
            any::gt
            any::waiter
            any::cpp11
            any::ggtext
            local::.
      - name: Reinstall repository packages with portable metadata
        shell: Rscript {0}
        run: |
          # pak records CRAN installs as RemoteType=standard and extra-packages
          # as RemoteType=any, both with Repository: RSPM (a name, not a URL).
          # renv snapshots that name, and shinyapps.io then tries
          # RSPM/src/contrib/... which is not a valid URL.
          # extra-packages can also carry PPM-only versions (data.table 1.18.6.1).
          installed <- installed.packages(fields = c("RemoteType", "Repository"))
          remote <- installed[, "RemoteType"]
          repository <- installed[, "Repository"]
          priority <- installed[, "Priority"]
          skip <- rownames(installed) %in% c("shinyglass", "rsconnect", "remotes") |
            (!is.na(priority) & priority %in% c("base", "recommended"))
          needs <- !skip & (
            (!is.na(remote) & remote %in% c("standard", "any")) |
            (!is.na(repository) & nzchar(repository) & !grepl("^https?://", repository))
          )
          rewrite <- unique(rownames(installed)[needs])
          any_pkgs <- intersect(
            rewrite,
            rownames(installed)[!is.na(remote) & remote == "any"]
          )
          standard_pkgs <- setdiff(rewrite, any_pkgs)
          if (length(standard_pkgs)) {
            message("Reinstalling from RSPM: ", paste(standard_pkgs, collapse = ", "))
            install.packages(standard_pkgs, repos = c(CRAN = Sys.getenv("RSPM")))
          }
          if (length(any_pkgs)) {
            message("Reinstalling from CRAN: ", paste(any_pkgs, collapse = ", "))
            ncpus <- max(1L, parallel::detectCores() - 1L)
            Sys.unsetenv(c("RSPM", "RENV_CONFIG_REPOS_OVERRIDE"))
            install.packages(
              any_pkgs,
              repos = c(CRAN = "https://cloud.r-project.org"),
              Ncpus = ncpus
            )
            installed2 <- installed.packages(fields = "RemoteType")
            present <- any_pkgs[any_pkgs %in% rownames(installed2)]
            remote2 <- installed2[present, "RemoteType"]
            still_any <- present[!is.na(remote2) & remote2 == "any"]
            if (length(still_any)) {
              stop("Failed to replace pak metadata for: ",
                   paste(still_any, collapse = ", "))
            }
          }
      - name: Install the exact main commit with GitHub provenance
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remotes::install_github(
            paste0("ericrayanderson/shinyglass@", Sys.getenv("GITHUB_SHA")),
            dependencies = FALSE, upgrade = "never", force = TRUE
          )
          stopifnot(identical(
            utils::packageDescription("shinyglass")$RemoteSha,
            Sys.getenv("GITHUB_SHA")
          ))
      - name: Authenticate and deploy (or stage a dry run)
        shell: Rscript {0}
        env:
          R_USER_CONFIG_DIR: ${{ runner.temp }}/shinyapps-config
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          DEPLOY_APPS: ${{ inputs.apps }}
          DEPLOY_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          dry_run <- identical(Sys.getenv("DEPLOY_DRY_RUN"), "true")
          if (!dry_run) {
            if (!nzchar(Sys.getenv("SHINYAPPS_TOKEN")) ||
                !nzchar(Sys.getenv("SHINYAPPS_SECRET"))) {
              stop("Add SHINYAPPS_TOKEN and SHINYAPPS_SECRET to the shinyapps-production environment.")
            }
            rsconnect::setAccountInfo(
              name = "ericrayanderson",
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
          }
          Sys.unsetenv(c("SHINYAPPS_TOKEN", "SHINYAPPS_SECRET"))
          apps <- Sys.getenv("DEPLOY_APPS")
          allowed <- c("demo", "dashboard", "intensity", "inputs", "olympics", "plotly_gt")
          if (identical(apps, "all")) apps <- paste(allowed, collapse = ",")
          if (identical(apps, "core5")) apps <- "demo,dashboard,inputs,olympics,plotly_gt"
          stopifnot(all(strsplit(apps, ",", fixed = TRUE)[[1]] %in% allowed))
          args <- c("inst/scripts/deploy-shinyapps-demos.R",
                    "--account=ericrayanderson", paste0("--apps=", apps))
          if (dry_run) args <- c(args, "--dry-run")
          status <- system2(file.path(R.home("bin"), "Rscript"), args)
          if (status != 0L) stop("Deployment script failed; inspect the preceding app logs.")
      - name: Remove temporary account configuration
        if: always()
        shell: Rscript {0}
        env:
          R_USER_CONFIG_DIR: ${{ runner.temp }}/shinyapps-config
        run: |
          config <- Sys.getenv("R_USER_CONFIG_DIR")
          expected <- file.path(Sys.getenv("RUNNER_TEMP"), "shinyapps-config")
          stopifnot(nzchar(Sys.getenv("RUNNER_TEMP")), identical(config, expected))
          unlink(config, recursive = TRUE)
