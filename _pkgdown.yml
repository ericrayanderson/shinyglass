url: https://ericrayanderson.github.io/shinyglass/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#007AFF"
    border-radius: 0.75rem
    btn-border-radius: 0.75rem

home:
  title: shinyglass • Liquid Glass themes for Shiny
  description: >
    Liquid Glass themes for R Shiny. One function, glass_theme(), for
    translucent surfaces, backdrop blur, and system typography on
    Bootstrap-based apps. Runtime light/dark/auto switching included.
  sidebar:
    structure: [links, license, community, citation, authors, dev]
    components:
      links:
        title: Links
        text: |
          [Source code](https://github.com/ericrayanderson/shinyglass)
          [Report a bug](https://github.com/ericrayanderson/shinyglass/issues)
          [Live demos](https://ericrayanderson.shinyapps.io/shinyglass-demo/) ·
          [plotly+gt](https://ericrayanderson.shinyapps.io/shinyglass-plotly-gt/)

navbar:
  structure:
    left:  [intro, articles, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: index.html
    articles:
      text: Articles
      menu:
        - text: Theming and light/dark
          href: articles/theming.html
        - text: Ecosystem compatibility
          href: articles/compatibility.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github
      href: https://github.com/ericrayanderson/shinyglass
      aria-label: GitHub

reference:
- title: Theme
  desc: Create and update a Liquid Glass theme for your Shiny app.
  contents:
  - glass_theme
  - update_glass_theme
  - glass_theme_toggle
  - observe_glass_theme_toggle

articles:
- title: Guides
  contents:
  - theming
  - compatibility

authors:
  Eric Anderson:
    href: https://github.com/ericrayanderson

# Keep the site at the package root even while DESCRIPTION is a .9000
# development version (otherwise pkgdown only publishes under /dev/).
development:
  mode: release
