[build-system]
requires = ["hatchling", "libsass>=0.22", "shiny>=1.0", "htmltools>=0.5"]
build-backend = "hatchling.build"

[project]
name = "shinyglass"
version = "0.1.0.9000"
description = "Liquid Glass themes for Shiny for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
authors = [
  { name = "Eric Anderson", email = "eric.ray.anderson@gmail.com" },
]
keywords = ["shiny", "theme", "bootstrap", "glass", "bslib"]
dependencies = [
  "shiny>=1.0",
  "htmltools>=0.5",
]

[project.optional-dependencies]
# Runtime Sass for custom primary/blur/radius (defaults use precompiled CSS)
theme = ["libsass>=0.22"]
dev = ["pytest>=7.0", "libsass>=0.22", "build", "matplotlib"]

[project.urls]
Homepage = "https://github.com/ericrayanderson/shinyglass"
Repository = "https://github.com/ericrayanderson/shinyglass"

[tool.hatch.build.targets.wheel]
packages = ["src/shinyglass"]

[tool.hatch.build.targets.sdist]
include = [
  "src/shinyglass",
  "scripts",
  "hatch_build.py",
  "README.md",
  "examples",
  "tests",
  "pyproject.toml",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
